plugins {
    id 'fabric-loom' version "${loom_version}"
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

// Game versions this build is published for, oldest first (colon separated in gradle.properties).
// The first entry is the manifest minimum, the whole list feeds the CurseForge/Modrinth tags.
ext.minecraftCompatVersions = rootProject.minecraft_compat_versions.split(':').collect { it.trim() }.findAll { it }

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {

    // Spell Power, Spell Engine, Mana Attributes, Attributes Attributes
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    // Fzzy Config
    maven {
        name = "FzzyMaven"
        url = "https://maven.fzzyhmstrs.me/"
    }

    // Cloth Config
    maven {
        url "https://maven.shedaniel.me/"
    }

    // Cloth Config
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }

    // Player Animator
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }

//	// Shoulder Surfing Reloaded // TODO Shoulder Surfing Compat
//	maven {
//		url "https://www.cursemaven.com"
//		content {
//			includeGroup("curse.maven")
//		}
//	}

}

sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

loom {
    runs {
        testmodClient {
            client()
            ideConfigGenerated project.rootProject == project
            name = "Testmod Client"
            source sourceSets.testmod
        }
        testmodServer {
            server()
            ideConfigGenerated project.rootProject == project
            name = "Testmod Server"
            source sourceSets.testmod
        }
    }

    mods {
        "spellengineextension_test" {
            sourceSet sourceSets.testmod
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Fzzy Config
    modImplementation "me.fzzyhmstrs:fzzy_config:${project.fzzy_config_version}"

    // Cloth Config
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")

    // Player Animation Lib
    modImplementation("dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_animator_version}")

    // Spell Engine
    modImplementation("maven.modrinth:spell-engine:${project.spell_engine_version}")

    // Spell Power
    modImplementation("maven.modrinth:spell-power:${project.spell_power_version}")

    // Tiny Config
    modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}")

    // Mana Attributes
    modImplementation "maven.modrinth:mana-attributes:${project.mana_attributes_version}"

    // Stamina Attributes
    modImplementation "maven.modrinth:stamina-attributes:${project.stamina_attributes_version}"

    // Resource Bar API
    modImplementation "maven.modrinth:resource-bar-api:${project.resource_bar_api_version}"

    // Ranged Weapon API
    modImplementation("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}")

    // Bundle API
    modImplementation("maven.modrinth:bundle-api:${project.bundle_api_version}")

    // Slot Customization API
    modImplementation("maven.modrinth:slot-customization-api:${project.slot_customization_api_version}")
//	modImplementation(files("libs/slot-customization-api-${project.slot_customization_api_version}.jar"))

    // Merged Items
    modImplementation("maven.modrinth:merged-items:${project.merged_items_version}")
//	modImplementation(files("libs/merged-items-${project.merged_items_version}.jar"))

    // RPG Inventory
    modImplementation("maven.modrinth:rpg-inventory:${project.rpg_inventory_version}")

    // Attack Range Attribute
    modImplementation("maven.modrinth:attack-range-attribute:${project.attack_range_attribute_version}")
//	modImplementation(files("libs/attack-range-attribute-${project.attack_range_attribute_version}.jar"))

//	// Shoulder Surfing Reloaded // TODO Shoulder Surfing Compat
//	modImplementation("curse.maven:shoulder-surfing-reloaded-243190:${project.shoulder_surfing_file_id}")

}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand(project.properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

ext.changelog_last_section = { ->
    return new File("CHANGELOG.md").text.split('\n# ')[0]
}

// Publishing is configured unconditionally: tasks only *run* when explicitly invoked
// (e.g. `publishMod` in CI), and all credentials are lazy env providers, so a local
// `build` — with none of the tokens present — is completely unaffected.
def releaseTypeName = (project.findProperty('release_type') ?: 'beta').toString()

// Local convenience alias -- CI invokes the per-destination publish tasks directly.
tasks.register("publishMod") {
    dependsOn(build)
    finalizedBy(tasks.named("publishMods"))
}

publishMods {
    file = remapJar.archiveFile
    changelog = providers.provider { changelog_last_section() }   // lazy: read only at publish
    type = releaseTypeName == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
            : releaseTypeName == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
            : me.modmuss50.mpp.ReleaseType.BETA
    version = "${project.version}"
//    version = "${project.version}-${platform}"   // per-loader suffix → unique Modrinth version
    displayName = "${project.version}"
    modLoaders.add("fabric")

    curseforge {
        projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")   // numeric id
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        minecraftVersions.addAll(project.minecraftCompatVersions)
        client = true                    // >=1 of client/server REQUIRED by CurseForge (Error 1021)
        server = true
        changelogType = "markdown"
        requires(
                "fzzy-config",
                "fabric-api",
                "spell-engine"
        )
        optional(
                "attack-range-attribute",
                "stamina-attributes",
                "mana-attributes",
                "ranged-weapon-api",
                "rpg-inventory"
        )
    }

    modrinth {
        environment = me.modmuss50.mpp.platforms.modrinth.ModrinthEnvironment.CLIENT_AND_SERVER
        projectId = providers.environmentVariable("MODRINTH_PROJECT_ID")
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        minecraftVersions.addAll(project.minecraftCompatVersions)
        requires(
                "fzzy-config",
                "fabric-api",
                "spell-engine"
        )
        optional(
                "attack-range-attribute",
                "stamina-attributes",
                "mana-attributes",
                "ranged-weapon-api",
                "rpg-inventory"
        )
    }

    // Each platform publishes its own GitHub release under a distinct, platform-suffixed
    // tag (e.g. `1.0.0+1.21.1-fabric`), so the two publish jobs don't collide.
    github {
        repository = providers.environmentVariable("GH_OWNER")
                .zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
        accessToken = providers.environmentVariable("GH_API_KEY")
        tagName = "${project.version}"
        // `commitish` is REQUIRED by the plugin. GITHUB_SHA is set automatically by GitHub
        // Actions to the triggering commit — valid even in a detached-HEAD checkout.
        commitish = providers.environmentVariable("GITHUB_SHA")
    }
}

// GitHub release last: a failed mod upload aborts the build before the release exists.
// Ordering only -- unselected tasks are ignored. Must sit after the publishMods block.
tasks.named("publishGithub") {
    mustRunAfter(tasks.named("publishCurseforge"), tasks.named("publishModrinth"))
}
